node:
  id: node2
  party_id: party2
  port: 50052

database:
  host: localhost
  port: 5433
  user: postgres
  password: postgres
  database: mpc_node2
  ssl_mode: disable
  max_conns: 10
  min_conns: 2

security:
  key_dir: ./keys/node2
  whitelist_file: ./config/whitelist.json
  peers_file: ./config/peers.json

tls:
  enabled: false
  # Раскомментируйте для включения TLS
  # cert_file: ./certs/node2-server.crt
  # key_file: ./certs/node2-server.key
  # ca_file: ./certs/ca.crt

logging:
  level: info  # debug, info, warn, error
  format: text # text или json
