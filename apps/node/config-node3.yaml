node:
  id: node3
  party_id: party3
  port: 50053

database:
  host: localhost
  port: 5434
  user: postgres
  password: postgres
  database: mpc_node3
  ssl_mode: disable
  max_conns: 10
  min_conns: 2

security:
  key_dir: ./keys/node3
  whitelist_file: ./config/whitelist.json
  peers_file: ./config/peers.json

tls:
  enabled: false
  # Раскомментируйте для включения TLS
  # cert_file: ./certs/node3-server.crt
  # key_file: ./certs/node3-server.key
  # ca_file: ./certs/ca.crt

logging:
  level: info  # debug, info, warn, error
  format: text # text или json
